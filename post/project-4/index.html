<h2 id="project-summary">Project Summary</h2>
<p>A path planning visualization that implements the A* path planning algorithm.</p>
<hr>
<h2 id="description">Description</h2>
<p>The A*star path planning algorithm is a popular and efficient graph traversal and search algorithm that was developed in 1968 by Peter Hart, Nils Nilsson and Bertram Raphael of the Stanford Research Institute.<br>
I have always been fascinated by the efficiency and complexity of search algorithms and this interest led me to try and implement the algorithm myself in an interesting and visual way.</p>
<hr>
<h2 id="implementation">Implementation</h2>
<p>To do this I used:-</p>
<ul>
<li>The <strong>Py-game</strong> python module for the visualization aspect.</li>
<li>Methods in <strong>Data Structures &amp; Algorithms</strong> and <strong>Priority Queues</strong> were crucial in the implementation of the actual A* algorithm.</li>
</ul>
<h2 id="how-to-use--visualize">How to use / Visualize</h2>
<h3 id="python-dependencies">Python Dependencies</h3>
<ul>
<li>Python 3.6 and up</li>
<li>Py-game library (latest version)</li>
<li>Math library</li>
<li>Priority Queue library</li>
</ul>
<hr>
<h3 id="running-the-visualizer">Running the Visualizer</h3>
<p>After running the program;</p>
<ol>
<li>Select the starting node from which the A* algorithm should begin the search.</li>
<li>Select a goal/end node at which the A* algorithm will attempt to reach.</li>
<li>Select barrier nodes that will represent obstacles that the algorithm must traverse to reach the goal node. (These will appear black in colour)</li>
<li>Hit the space bar and enjoy the visualization of the searching process.</li>
</ol>
