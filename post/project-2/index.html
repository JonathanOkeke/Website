      <h1>Used vehicle price predictor</h1>
      <p class="lede">A Flask application that estimates what a used sedan might sell for using an XGBoost model.</p>

    </header>
      <div class="prose project-content"><p><a href="https://github.com/JonathanOkeke/Prediciting-PreOwned-Vehicle-Sale-Price">View source on GitHub</a></p>
<h3 id="project-summary">Project Summary</h3>
<p>A web-based tool that any sedan vehicle owner can use to get an estimate of what their vehicle would be worth based on various factors.</p>
<p>The service uses a trained XGBoost linear regression model, trained on historical vehicle data obtained from Kaggle, to make a vehicle sale price estimate.</p>
<p>The model was wrapped as a Flask Web Application and deployed to the internet using Heroku.</p>
<hr>
<h3 id="skills-and-technologies-used">Skills and Technologies Used</h3>
<p><strong>Web Application Development</strong><br>
•  Flask •   Heroku</p>
<p><strong>Machine Learning</strong><br>
•  Scikit-Learn •  Pandas •  Numpy •  Matplotlib</p>
<hr>
<h3 id="data">Data</h3>
<p>The dataset used for this project was retrieved from Kaggle at : <a href="https://www.kaggle.com/nehalbirla/vehicle-dataset-from-cardekho">https://www.kaggle.com/nehalbirla/vehicle-dataset-from-cardekho</a></p>
<p><strong>Data Features</strong></p>
<ol>
<li><strong>Year</strong> - year of manufacture.</li>
<li><strong>Present Price</strong> - price of the vehicle if newly purchased from a dealership. ( In Indian Rupees (Lakhs)). Where 1 Lakh = 100,000 Rupees</li>
<li><strong>Kms_Driven</strong> - the odometer in kilometers throughout the car&rsquo;s use.</li>
<li><strong>Fuel_Type</strong> - type of fuel the vehicle runs on (Diesel/Petrol/CNG)</li>
<li><strong>Seller_Type</strong> - mode through which the vehicle is being sold (Dealer/Individual)</li>
<li><strong>Transmission</strong> - vehicle transmission type (Automatic/Manual)</li>
<li><strong>Owner</strong> - number of previous owners.</li>
<li><strong>Selling_Price</strong> - the price that the pre-owned vehicle was actually sold for. (In Indian Rupees (Lakhs)). Where 1 Lakh = 100,000 Rupees</li>
</ol>
<p><strong>All prices were converted from Indian Rupees to South African Rands (ZAR).</strong></p>
<hr>
<h3 id="modelling">Modelling</h3>
<p>The <code>Selling_Price</code> feature was the ground truth, leaving features 1-7 as the features from which the model would learn from.</p>
<p>Four different estimators were experimented with for this project. They were:-</p>
<ol>
<li>Random Forest Regressor</li>
<li>Vanilla Linear Regressor</li>
<li>Ridge Regressor</li>
<li>XGB Regressor (xgboost)</li>
</ol>
<hr>
<h3 id="evaluation-metrics">Evaluation Metrics</h3>
<p>A five-fold cross valdated R² and MSE score were used to evaluate the four models.</p>
<hr>
<h3 id="modelling-results">Modelling Results</h3>
<p>Of the four fitted and evaluated estimators, the XGB Regressor model performed the best (metric-wise)</p>

<h4 id="the-feature-importance-analysis-revealed">The feature importance analysis revealed:</h4>
<ol>
<li>The <code>Present_Price</code> (current new vehicle sale price) is the most important feature.</li>
<li>The <code>Age</code> of the vehicle was the second most important feature.</li>
<li>The <code>Kms_Driven</code> by the vehicle was the third most important feature.</li>
</ol>
<hr>
<h3 id="investigation-summary">Investigation Summary</h3>
<p>These findings fall right in line with the general vehicle value trends which are mainly determined by their depreciation due to their <code>off-the-lot price</code>, their <code>age</code> and <code>mileage</code>.</p></div>
